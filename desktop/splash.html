<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Hammer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #140c0e;
        --surface: #1e1417;
        --border: #33232a;
        --text: #f1e5e3;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: radial-gradient(circle at 50% 0%, #2a1119 0%, var(--bg) 62%);
        color: #f1e5e3;
        font:
          14px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
      }
      main {
        width: min(440px, calc(100vw - 64px));
        text-align: center;
      }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 22px;
        border-radius: 16px;
        box-shadow: 0 18px 40px rgba(224, 140, 150, 0.18);
      }
      h1 {
        font-size: 1.35rem;
        letter-spacing: 0.02em;
        margin: 0 0 6px;
      }
      .tagline {
        margin: 0 0 30px;
        color: #a08a8b;
        font-size: 0.82rem;
      }
      .bar {
        height: 3px;
        border-radius: 999px;
        background: #2a1d21;
        overflow: hidden;
      }
      .bar span {
        display: block;
        height: 100%;
        width: 38%;
        border-radius: inherit;
        background: linear-gradient(90deg, #8c2a38, #e08c96);
        animation: slide 1.4s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      #splash-status {
        margin: 20px 0 4px;
        font-weight: 600;
        font-size: 0.9rem;
      }
      #splash-detail {
        margin: 0;
        min-height: 1.2em;
        color: #a08a8b;
        font-size: 0.78rem;
        font-variant-numeric: tabular-nums;
      }
      .note {
        margin: 34px 0 0;
        color: #7d6a6d;
        font-size: 0.72rem;
        line-height: 1.6;
      }
      body.failed .bar span {
        animation: none;
        width: 100%;
        background: #b4544f;
      }
      body.failed #splash-status {
        color: #e7948f;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Same mark as the app icon and the favicon: tools/make-desktop-icons.mjs. -->
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="6" fill="#7d2231" />
        <g
          transform="translate(-2.2 5.18) rotate(32 16 16) translate(16 16) scale(1.1) translate(-16 -16)"
        >
          <path
            d="M12.55 8.4L14.45 8.4C14.6 9.6 14.72 10.6 14.72 12.2C14.72 14.5 14.5 17.5 14.55 19.4C14.6 21.2 14.85 22.6 14.86 23.4C14.88 24.6 14.4 25.1 13.5 25.1C12.6 25.1 12.12 24.6 12.14 23.4C12.15 22.6 12.4 21.2 12.45 19.4C12.5 17.5 12.28 14.5 12.28 12.2C12.28 10.6 12.4 9.6 12.55 8.4Z"
            fill="#d9c3bb"
          />
          <path
            d="M21.76 2.91L19.86 2.91C19 2.91 18.49 3.6 17.63 3.6C16.6 3.6 16.08 2.91 15.05 2.91L11.95 2.91C8.17 2.91 5.42 4.63 3.18 8.07C5.93 5.83 8.34 6 11.09 6.69C11.78 6.86 11.95 7.72 12.12 9.1L14.88 9.1C15.05 7.72 15.22 6.86 16.08 6.52C16.77 6.18 17.11 6 17.63 6C18.49 6 19 6.69 19.86 6.69L21.76 6.69L22.27 6.18L22.27 3.42Z"
            fill="#f6ece5"
          />
        </g>
      </svg>
      <h1>Hammer</h1>
      <p class="tagline">Local router for coding models</p>
      <div class="bar"><span></span></div>
      <p id="splash-status" role="status" aria-live="polite">Starting router…</p>
      <p id="splash-detail"></p>
      <p class="note">
        Provider models are discovered before the dashboard opens.<br />
        The router at 127.0.0.1 stays available to your coding tools.
      </p>
    </main>
    <script>
      // Called from the main process. It only ever writes text, never HTML, so a provider error
      // quoted into a status line cannot inject markup into this window.
      window.setSplashStatus = function (status, detail) {
        document.body.classList.remove('failed')
        document.getElementById('splash-status').textContent = String(status || '')
        document.getElementById('splash-detail').textContent = String(detail || '')
      }
      window.showSplashError = function (message) {
        document.body.classList.add('failed')
        document.getElementById('splash-status').textContent = 'Hammer could not start'
        document.getElementById('splash-detail').textContent = String(message || '')
      }
    </script>
  </body>
</html>
