<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9cc4e8"/>
      <stop offset="45%" stop-color="#cfe2f5"/>
      <stop offset="100%" stop-color="#d6d2cb"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b3b3d"/>
      <stop offset="100%" stop-color="#1c1c1e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0%" stop-color="#fff6d8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffe7a8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffe7a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9c7e6"/>
      <stop offset="100%" stop-color="#7d9fc4"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" fill="#1b1b1e"/>

  <!-- Arched window shape, iron frame -->
  <g fill="url(#iron)">
    <!-- Outer frame -->
    <path d="M6 25 L6 12 Q6 6 16 6 Q26 6 26 12 L26 25 Z"/>
    <!-- Inner opening (sky) -->
    <path d="M8 25 L8 12.5 Q8 7.5 16 7.5 Q24 7.5 24 12.5 L24 25 Z" fill="url(#sky)"/>
    <!-- Glass tint overlay -->
    <path d="M8 25 L8 12.5 Q8 7.5 16 7.5 Q24 7.5 24 12.5 L24 25 Z" fill="url(#glow)"/>
    <path d="M8 25 L8 12.5 Q8 7.5 16 7.5 Q24 7.5 24 12.5 L24 25 Z" fill="url(#glass)" opacity="0.18"/>

    <!-- Tracery: central vertical mullion -->
    <rect x="15.4" y="7.5" width="1.2" height="17.5"/>
    <!-- Lateral mullions -->
    <rect x="7.6" y="12.5" width="1.2" height="12.5"/>
    <rect x="23.2" y="12.5" width="1.2" height="12.5"/>
    <!-- Arch rib -->
    <path d="M16 6 L16 22" stroke="#2c2c2e" stroke-width="1.4"/>
    <!-- Circular rose window hint -->
    <circle cx="16" cy="14.5" r="3.2" fill="none" stroke="#2c2c2e" stroke-width="0.8"/>
    <circle cx="16" cy="14.5" r="1.4" fill="#2c2c2e"/>
    <!-- Rays in rose -->
    <g stroke="#2c2c2e" stroke-width="0.4">
      <line x1="16" y1="11" x2="16" y2="18"/>
      <line x1="12.5" y1="14.5" x2="19.5" y2="14.5"/>
      <line x1="13.5" y1="11.5" x2="18.5" y2="17.5"/>
      <line x1="18.5" y1="11.5" x2="13.5" y2="17.5"/>
    </g>

    <!-- Keystone at apex -->
    <path d="M14.2 6 L17.8 6 L17 8 L15 8 Z" fill="#4a4a4c"/>
    <!-- Sill -->
    <rect x="5.4" y="24.4" width="21.2" height="1.2" rx="0.4"/>

    <!-- Weathering: rust streaks on iron -->
    <g opacity="0.4">
      <rect x="6.6" y="15" width="0.6" height="8" fill="#7a4a2a"/>
      <rect x="24.8" y="13" width="0.6" height="10" fill="#7a4a2a"/>
      <rect x="15.6" y="18" width="0.6" height="6" fill="#7a4a2a"/>
    </g>
  </g>

  <!-- Light catching the arch -->
  <path d="M8 12 Q8 7.5 16 7.5 Q24 7.5 24 12" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.5"/>
</svg>
