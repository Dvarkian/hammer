<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#1a1816"/>

  <g transform="rotate(-22 16 17)">
    <!-- Head: square block, chisel face on one side, flat on other -->
    <rect x="4" y="10" width="24" height="7" fill="#5a544c"/>
    <rect x="4" y="10" width="24" height="3.5" fill="#c8c4bc"/>
    <rect x="4" y="10" width="24" height="1.5" fill="#e8e4df" opacity="0.5"/>

    <!-- Chisel edge detail -->
    <path d="M4 14 L2.5 13 L2.5 14.5 L4 15.5Z" fill="#3a3530"/>
    <path d="M4 14.2 L3 13.5 L3 14.5 L4 15Z" fill="#2a2520" opacity="0.7"/>

    <!-- Handle: thick, short, wood -->
    <rect x="12.5" y="17" width="7" height="11" rx="1" fill="#6b5a42"/>
    <rect x="12.5" y="17" width="7" height="11" rx="1" fill="none" stroke="#5a4a35" stroke-width="0.4"/>

    <!-- Grip section: wider -->
    <path d="M12 21 L12 25 Q12 26 13 26 L19 26 Q20 26 20 25 L20 21Z" fill="#5a4a35"/>
    <path d="M12 21 L12 25 Q12 26 13 26 L19 26 Q20 26 20 25 L20 21Z" fill="none" stroke="#4a3520" stroke-width="0.4"/>

    <!-- Wedge end -->
    <rect x="12.5" y="27" width="7" height="1.5" fill="#4a3d2a" opacity="0.6"/>

    <!-- Texture: surface scratches on head -->
    <g stroke="#9a9088" stroke-width="0.3" opacity="0.3">
      <line x1="5" y1="12" x2="26" y2="12"/>
      <line x1="5" y1="13" x2="26" y2="13"/>
      <line x1="6" y1="13.5" x2="25" y2="13.5"/>
    </g>
  </g>
</svg>
