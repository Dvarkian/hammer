<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2520"/>
      <stop offset="100%" stop-color="#16120f"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c89b6a"/>
      <stop offset="50%" stop-color="#a87a4a"/>
      <stop offset="100%" stop-color="#7a5532"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a7a80"/>
      <stop offset="100%" stop-color="#3a3a40"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" fill="url(#bg)"/>

  <!-- Kumiko grid: interlocking parallelogram inlays -->
  <g>
    <!-- Outer frame -->
    <rect x="4" y="4" width="24" height="24" fill="url(#iron)"/>
    <rect x="4" y="4" width="24" height="24" fill="none" stroke="#8a8a90" stroke-width="0.6"/>

    <!-- Inner panel — wood with grain -->
    <rect x="5.5" y="5.5" width="21" height="21" fill="url(#wood)"/>
    <!-- Wood grain lines -->
    <g stroke="#6b4528" stroke-width="0.25" opacity="0.5">
      <line x1="5.5" y1="9" x2="26.5" y2="9"/>
      <line x1="5.5" y1="14" x2="26.5" y2="14"/>
      <line x1="5.5" y1="19" x2="26.5" y2="19"/>
    </g>

    <!-- Kumiko joints: crossing diagonal members -->
    <g stroke="#3a2618" stroke-width="1.4" fill="none">
      <line x1="5.5" y1="5.5" x2="26.5" y2="26.5"/>
      <line x1="26.5" y1="5.5" x2="5.5" y2="26.5"/>
    </g>

    <!-- Inlay diamonds at centers -->
    <path d="M16 9 L21 14 L16 19 L11 14 Z" fill="#3a2618"/>
    <path d="M16 9 L21 14 L16 19 L11 14 Z" fill="none" stroke="#c89b6a" stroke-width="0.4"/>

    <path d="M13 11 L16 13.5 L13 16 L10 13.5 Z" fill="#c89b6a"/>
    <path d="M19 11 L22 13.5 L19 16 L16 13.5 Z" fill="#c89b6a"/>
    <path d="M13 16 L16 18.5 L13 21 L10 18.5 Z" fill="#c89b6a"/>
    <path d="M19 16 L22 18.5 L19 21 L16 18.5 Z" fill="#c89b6a"/>

    <!-- Center pin -->
    <circle cx="16" cy="16" r="1.6" fill="#1a1208"/>
    <circle cx="16" cy="16" r="0.8" fill="#c89b6a"/>
  </g>

  <!-- Hammer head mounted through center: simplified T -->
  <g>
    <!-- Handle rising from bottom -->
    <rect x="14.4" y="22" width="3.2" height="8.5" fill="url(#wood)"/>
    <rect x="14.4" y="22" width="3.2" height="8.5" fill="none" stroke="#6b4528" stroke-width="0.4"/>
    <!-- Head cap -->
    <rect x="4" y="19" width="24" height="4" fill="url(#iron)"/>
    <rect x="4" y="19" width="24" height="1" fill="#9a9aa0" opacity="0.7"/>
    <rect x="4" y="22.5" width="24" height="0.5" fill="#2a2a30" opacity="0.6"/>
  </g>
</svg>
