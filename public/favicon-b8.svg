<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#1a1816"/>

  <g transform="rotate(-10 16 17)">
    <!-- Head: small, compact, rounded -->
    <rect x="6" y="10" width="20" height="8" rx="4" fill="#5a544c"/>
    <rect x="6" y="10" width="20" height="4" rx="4" fill="#c8c4bc"/>
    <rect x="6" y="10" width="20" height="1.5" rx="4" fill="#e8e4df" opacity="0.5"/>

    <!-- Handle: thin, long -->
    <rect x="13.5" y="18" width="5" height="11" rx="1" fill="#6b5a42"/>
    <rect x="13.5" y="18" width="5" height="11" rx="1" fill="none" stroke="#5a4a35" stroke-width="0.4"/>

    <!-- Grip rings on handle -->
    <rect x="13.5" y="23" width="5" height="0.4" fill="#4a3d2a" opacity="0.5"/>
    <rect x="13.5" y="25" width="5" height="0.4" fill="#4a3d2a" opacity="0.5"/>
    <rect x="13.5" y="27" width="5" height="0.4" fill="#4a3d2a" opacity="0.5"/>

    <!-- Wedge -->
    <path d="M13.5 28 L13 29.5 L14.5 30 L17.5 30 L19 29.5 L18.5 28Z" fill="#4a3d2a"/>
    <path d="M14.5 28 L14.2 29.2 L15 30 L17 30 L17.8 29.2 L17.5 28Z" fill="#6b5a42" opacity="0.6"/>

    <!-- Checkering on head -->
    <g stroke="#9a9088" stroke-width="0.3" opacity="0.3">
      <line x1="7" y1="12" x2="25" y2="12"/>
      <line x1="7" y1="13" x2="25" y2="13"/>
    </g>
  </g>
</svg>
