<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#1a1a22"/>
      <stop offset="100%" stop-color="#0a0a0e"/>
    </radialGradient>
    <linearGradient id="ruby" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9b1c2e"/>
      <stop offset="100%" stop-color="#5a0e18"/>
    </linearGradient>
    <linearGradient id="sapphire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a6b"/>
      <stop offset="100%" stop-color="#0a1f3a"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c87820"/>
      <stop offset="100%" stop-color="#8a4f12"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f6b4a"/>
      <stop offset="100%" stop-color="#0f3f2a"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f5e8c8"/>
      <stop offset="100%" stop-color="#c8a86a"/>
    </radialGradient>
  </defs>

  <rect width="32" height="32" fill="url(#bg)"/>

  <g fill="none" stroke="#c8a86a" stroke-width="0.6" opacity="0.7">
    <circle cx="16" cy="16" r="13"/>
    <circle cx="16" cy="16" r="9.5"/>
    <circle cx="16" cy="16" r="6"/>
  </g>

  <!-- Six petal segments around hub -->
  <g>
    <path d="M16 16 L16 3 A13 13 0 0 1 29 16 Z" fill="url(#ruby)" opacity="0.85"/>
    <path d="M16 16 L16 3 A13 13 0 0 1 29 16 Z" fill="none" stroke="#c8a86a" stroke-width="0.5"/>
    <path d="M16 16 L29 16 A13 13 0 0 1 16 29 Z" fill="url(#sapphire)" opacity="0.85"/>
    <path d="M16 16 L29 16 A13 13 0 0 1 16 29 Z" fill="none" stroke="#c8a86a" stroke-width="0.5"/>
    <path d="M16 16 L3 16 A13 13 0 0 1 16 29 Z" fill="url(#amber)" opacity="0.85"/>
    <path d="M16 16 L3 16 A13 13 0 0 1 16 29 Z" fill="none" stroke="#c8a86a" stroke-width="0.5"/>
    <path d="M16 16 L16 29 A13 13 0 0 1 3 16 Z" fill="url(#emerald)" opacity="0.85"/>
    <path d="M16 16 L16 29 A13 13 0 0 1 3 16 Z" fill="none" stroke="#c8a86a" stroke-width="0.5"/>
  </g>

  <!-- Inner wheel: six smaller petals -->
  <g>
    <path d="M16 16 L16 7 A9.5 9.5 0 0 1 25.5 16 Z" fill="url(#sapphire)" opacity="0.7"/>
    <path d="M16 16 L25.5 16 A9.5 9.5 0 0 1 16 25.5 Z" fill="url(#amber)" opacity="0.7"/>
    <path d="M16 16 L7 16 A9.5 9.5 0 0 1 16 25.5 Z" fill="url(#ruby)" opacity="0.7"/>
    <path d="M16 16 L16 25.5 A9.5 9.5 0 0 1 7 16 Z" fill="url(#emerald)" opacity="0.7"/>
  </g>

  <!-- Central hub -->
  <circle cx="16" cy="16" r="3.2" fill="url(#hub)"/>
  <circle cx="16" cy="16" r="3.2" fill="none" stroke="#8a6a3a" stroke-width="0.6"/>
  <circle cx="16" cy="16" r="1.4" fill="#8a6a3a"/>

  <!-- Lead lines catching light -->
  <g stroke="#f5e8c8" stroke-width="0.4" opacity="0.4">
    <line x1="16" y1="2" x2="16" y2="29"/>
    <line x1="2" y1="16" x2="30" y2="16"/>
    <line x1="6" y1="6" x2="26" y2="26"/>
    <line x1="26" y1="6" x2="6" y2="26"/>
  </g>
</svg>
